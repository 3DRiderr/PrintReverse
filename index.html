<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I miei Artefatti Claude</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9f9fb;
      color: #1a1a1a;
    }
    h1 { border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }
    .card h2 { margin-top: 0; font-size: 1.2rem; color: #d97757; }
    .card p { font-size: 0.95rem; color: #555; margin-bottom: 0; }
  </style>
</head>
<body>

  <p>Una raccolta interattiva di strumenti, giochi e esperimenti.</p>

      <h2>Titolo Primo Artefatto</h2>
      <p>Breve descrizione di cosa fa questo progetto.</p>

    <!-- Secondo Artefatto -->

  </div>
</body>
</html>
